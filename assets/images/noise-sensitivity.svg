 <title id="noise-sensitivity-title">Sensitivity to Gaussian noise scale</title>
 <desc id="noise-sensitivity-desc">ImageNet-1K linear-probe accuracy for ResNet-50, varying one factor at a time. 4.25: 62.32 percent; 4.5: 67.92 percent (default); 5: 65.43 percent. Shared vertical axis: 55 to 70 percent. Source: paper Table 3. Connecting lines guide the eye; no uncertainty estimates are reported.</desc>
